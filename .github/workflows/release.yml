name: Windows Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/build-release.cjs
        env:
          CSC_LINK: ${{ secrets.WINDOWS_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          APOLLO_AZURE_SIGNING_JSON: ${{ vars.AZURE_SIGNING_CONFIG }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Apollo-Code-Setup-*-x64.exe
            release/Apollo-Code-Setup-*-x64.exe.blockmap
            release/latest.yml
